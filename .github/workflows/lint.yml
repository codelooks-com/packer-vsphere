---
name: Lint

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    permissions:
      contents: read
      statuses: write
      pull-requests: write
    uses: LukeEvansTech/shared-workflows/.github/workflows/super-linter.yml@4ad6729e601bf0b89eb08d8bf6ebc0e9cf91b775 # v1
    with:
      default-branch: main
      soft-launch: false
      # build.sh/download.sh/config.sh/set-envvars.sh are vendored from
      # upstream vmware/packer-examples-for-vsphere — not house style; we
      # carry minimal surgical diffs and re-merge upstream periodically.
      # *.pkrtpl.hcl are Packer templatefile() inputs (%{ ~} directives),
      # not Terragrunt HCL — terragrunt hclfmt cannot parse them.
      # docs/ is the Zensical site: MkDocs-Material admonitions/snippets/icons
      # that default prettier/markdownlint mangle (prettier de-indents
      # admonition bodies, breaking them) — it is validated by `zensical build`
      # instead. The repo README stays house-style linted.
      filter-regex-exclude: '(^|/)(vendor|node_modules|\.terraform|\.venv|dist|build|docs)/|.*\.tmpl$|.*\.pkrtpl\.hcl$|(^|/)(build|download|config|set-envvars)\.sh$'
