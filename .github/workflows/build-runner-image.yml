---
name: build-runner-image
on:
  push:
    branches: [main]
    paths:
      - runner/Dockerfile
      - .mise.toml
      - ansible/**
      - packer.pkr.hcl
      - .github/workflows/build-runner-image.yml
  workflow_dispatch: {}

concurrency:
  group: build-runner-image
  cancel-in-progress: true

permissions:
  contents: read

env:
  # This is the image we BUILD and PUSH (used as ${IMAGE}:latest / ${IMAGE}:date-sha
  # below), not one we pull — it must stay a bare name with no digest. Renovate is
  # told to leave it alone in .renovaterc.json5 (packageRules).
  IMAGE: ghcr.io/codelooks-com/packer-runner

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Log in to ghcr.io
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Compute tags
        id: tags
        run: |
          echo "date=$(date -u +%Y%m%d)" >>"$GITHUB_OUTPUT"
          echo "sha=${GITHUB_SHA::7}" >>"$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: runner/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ steps.tags.outputs.date }}-${{ steps.tags.outputs.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
